[build]
builder = "NIXPACKS"
# --include=dev: NODE_ENV=production on Railway makes plain `npm ci` skip devDependencies (tsc, prisma CLI).
buildCommand = "npm ci --include=dev && npm run db:generate && npm run build"

[deploy]
preDeployCommand = "npm run db:migrate:deploy"
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30

# Cron Service создаётся в Railway отдельным сервисом из этого же репозитория:
#   Start Command: npm run db:migrate:deploy && npm run cron:simulate
#   Cron Schedule: */15 * * * *   (Railway планирует в UTC, раунды считаются в Asia/Almaty)
