[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run db:generate && npm run build"

[deploy]
startCommand = "npm run db:migrate:deploy && npm run db:seed && npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30

# Cron Service создаётся в Railway отдельным сервисом из этого же репозитория:
#   Start Command: npm run db:migrate:deploy && npm run cron:simulate
#   Cron Schedule: */15 * * * *   (Railway планирует в UTC, раунды считаются в Asia/Almaty)
