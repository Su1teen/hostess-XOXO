name: QR integration checks
on:
  push:
    branches: [main, codex/qr-order-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qr_integration_test?schema=public
      QR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qr_integration_test?schema=public
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/exchange_regression_test?schema=public
      ADMIN_API_KEY: test-admin-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create isolated databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE qr_integration_test'
          psql -h localhost -U postgres -c 'CREATE DATABASE exchange_regression_test'
          psql -h localhost -U postgres -c 'CREATE DATABASE qr_shadow_test'
      - name: Deploy migrations twice (second deployment must be a no-op)
        run: |
          npm run db:migrate:deploy
          npm run db:migrate:deploy
          DATABASE_URL="$E2E_DATABASE_URL" npm run db:migrate:deploy
      - run: npx prisma validate
      - name: Verify migrations match schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://postgres:postgres@localhost:5432/qr_shadow_test --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:contract
      - run: npm test -- --maxWorkers=2 --minWorkers=1
